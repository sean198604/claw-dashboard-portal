services:
  nginx:
    image: nginx:alpine
    container_name: claw-nginx-proxy
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard-portal
    networks:
      - claw_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: claw-dashboard-portal:latest
    container_name: claw-dashboard-portal-1
    restart: unless-stopped
    expose:
      - "8888"
    volumes:
      - portal_data:/app/data
    environment:
      - ADMIN_PASSWORD=1234
    networks:
      - claw_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  portal_data:
    name: claw_portal_data

networks:
  claw_net:
    name: claw_net
    external: true
